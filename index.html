<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서진이의 감정 쓰레기통</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK (Compat 라이브러리 사용) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Firebase 초기화 및 설정 ---
    const firebaseConfig = {
      apiKey: "AIzaSyDMjrsZI4PidxKa4U_0_GqSHHV1tE6KipA",
      authDomain: "seojinyongsang-a7a74.firebaseapp.com",
      projectId: "seojinyongsang-a7a74",
      storageBucket: "seojinyongsang-a7a74.firebasestorage.app",
      messagingSenderId: "1046466987311",
      appId: "1:1046466987311:web:cddfd25b4fc7c593d28dda"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // --- 아이콘 컴포넌트 ---
    const Icon = ({ path, size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {path}
      </svg>
    );

    const Activity = (p) => <Icon {...p} path={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>} />;
    const Camera = (p) => <Icon {...p} path={<><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></>} />;
    const Receipt = (p) => <Icon {...p} path={<><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6"></path><path d="M16 12h-8"></path><path d="M16 16h-8"></path></>} />;
    const Trash2 = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></>} />;
    const Plus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>} />;
    const ImageIcon = (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></>} />;
    const X = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>} />;
    const Send = (p) => <Icon {...p} path={<><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></>} />;
    const Users = (p) => <Icon {...p} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></>} />;
    const CalendarIcon = (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></>} />;
    const ChevronLeft = (p) => <Icon {...p} path={<><polyline points="15 18 9 12 15 6"></polyline></>} />;
    const ChevronRight = (p) => <Icon {...p} path={<><polyline points="9 18 15 12 9 6"></polyline></>} />;
    const LogOut = (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></>} />;

    // --- 이미지 압축 유틸리티 (Firestore 용량 제한 방지) ---
    const compressImage = (file, maxWidth = 800, maxHeight = 800, quality = 0.7) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height *= maxWidth / width;
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width *= maxHeight / height;
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    };

    function App() {
      // --- 로그인 상태 ---
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('sensitivity');
      const todayDate = new Date().toLocaleDateString('ko-KR');

      // --- 상태 관리 (빈 배열로 시작하여 DB에서 불러옴) ---
      const [sensitivity, setSensitivity] = useState(50);
      const [sensitivityLog, setSensitivityLog] = useState([]);
      
      const [meals, setMeals] = useState([]);
      const [menuInput, setMenuInput] = useState('');
      const [selectedImage, setSelectedImage] = useState(null);
      const [mealFilter, setMealFilter] = useState('ALL');

      const [expenses, setExpenses] = useState([]);
      const [expenseItem, setExpenseItem] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expenseFilter, setExpenseFilter] = useState('ALL');

      const [currentCalDate, setCurrentCalDate] = useState(new Date());

      const [trashText, setTrashText] = useState('');
      const [trashedItems, setTrashedItems] = useState([]);
      const [isThrowing, setIsThrowing] = useState(false);

      // --- 실시간 데이터베이스 연결 (Firebase Listener) ---
      useEffect(() => {
        if (!isLoggedIn) return;

        // 예민함 기록 불러오기
        const unsubSens = db.collection('sensitivityLogs').orderBy('createdAt', 'desc').onSnapshot(snap => {
          setSensitivityLog(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        // 식단 기록 불러오기
        const unsubMeals = db.collection('meals').orderBy('createdAt', 'desc').onSnapshot(snap => {
          setMeals(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        // 가계부 기록 불러오기
        const unsubExp = db.collection('expenses').orderBy('createdAt', 'desc').onSnapshot(snap => {
          setExpenses(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        // 감정 쓰레기통 불러오기
        const unsubTrash = db.collection('trashedItems').orderBy('createdAt', 'desc').onSnapshot(snap => {
          setTrashedItems(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        return () => {
          unsubSens();
          unsubMeals();
          unsubExp();
          unsubTrash();
        };
      }, [isLoggedIn]);

      // --- DB 저장 및 삭제 핸들러 ---

      const handleSaveSensitivity = async () => {
        await db.collection('sensitivityLogs').add({
          date: todayDate,
          time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
          level: sensitivity,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      };
      
      const handleDeleteSensitivity = async (id) => {
        await db.collection('sensitivityLogs').doc(id).delete();
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressedBase64 = await compressImage(file, 800, 800, 0.7);
          setSelectedImage(compressedBase64);
        }
      };

      const handleAddMeal = async () => {
        if (!selectedImage && !menuInput.trim()) return;
        await db.collection('meals').add({
          date: todayDate,
          time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
          author: currentUser,
          image: selectedImage || null,
          menu: menuInput || '이름 없는 메뉴',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        setSelectedImage(null);
        setMenuInput('');
      };

      const handleDeleteMeal = async (id) => {
        await db.collection('meals').doc(id).delete();
      };

      const getCategory = (item) => {
        if (/(커피|카페|아아|라떼|스벅|스타벅스|메가|빽다방|디저트)/.test(item)) return '커피/간식';
        if (/(술|맥주|소주|노래방|호프|포차|유흥|클럽)/.test(item)) return '유흥';
        if (/(밥|식당|돈까스|국밥|치킨|피자|버거|배달|마라탕|식비|초밥)/.test(item)) return '식비';
        if (/(택시|버스|지하철|교통|기차|ktx)/i.test(item)) return '교통';
        if (/(옷|신발|올영|올리브영|쇼핑|화장품)/.test(item)) return '쇼핑';
        return '기타';
      };

      const handleAddExpense = async () => {
        if (!expenseItem.trim() || !expenseAmount) return;
        await db.collection('expenses').add({
          date: todayDate,
          time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
          author: currentUser,
          item: expenseItem,
          amount: parseInt(expenseAmount, 10),
          category: getCategory(expenseItem),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        setExpenseItem('');
        setExpenseAmount('');
      };

      const handleDeleteExpense = async (id) => {
        await db.collection('expenses').doc(id).delete();
      };

      const handleThrowAway = async () => {
        if (!trashText.trim()) return;
        setIsThrowing(true);
        const currentText = trashText;
        setTrashText(''); 

        await db.collection('trashedItems').add({
          text: currentText,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        setTimeout(() => setIsThrowing(false), 600);
      };

      // --- 계산 로직 ---
      const todayExpenses = expenses.filter(exp => exp.date === todayDate);
      const filteredExpenses = expenseFilter === 'ALL' 
        ? todayExpenses 
        : todayExpenses.filter(exp => exp.author === expenseFilter);

      const totalExpense = filteredExpenses.reduce((acc, curr) => acc + curr.amount, 0);
      const expensesByCategory = filteredExpenses.reduce((acc, curr) => {
        acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
        return acc;
      }, {});

      // 달력 로직
      const calYear = currentCalDate.getFullYear();
      const calMonth = currentCalDate.getMonth();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const firstDayOfMonth = new Date(calYear, calMonth, 1).getDay();
      
      const prevMonth = () => setCurrentCalDate(new Date(calYear, calMonth - 1, 1));
      const nextMonth = () => setCurrentCalDate(new Date(calYear, calMonth + 1, 1));

      const expensesByDate = expenses.reduce((acc, exp) => {
        acc[exp.date] = (acc[exp.date] || 0) + exp.amount;
        return acc;
      }, {});

      // --- 렌더링 (Rendering) ---

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-rose-50 flex justify-center items-center text-gray-800 font-sans p-5 w-full">
            <div className="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 text-center animate-fade-in">
              <h1 className="text-3xl font-bold text-rose-500 mb-2 tracking-tight">서진이의 감정 쓰레기통 🗑️</h1>
              <p className="text-gray-500 mb-10 font-medium">누구로 접속할까요?</p>

              <div className="space-y-4">
                <button
                  onClick={() => { setCurrentUser('이서진'); setIsLoggedIn(true); }}
                  className="w-full bg-rose-400 hover:bg-rose-500 text-white font-bold py-4 rounded-2xl text-lg transition-transform hover:scale-105 active:scale-95 shadow-sm"
                >
                  이서진
                </button>
                <button
                  onClick={() => { setCurrentUser('이용상'); setIsLoggedIn(true); }}
                  className="w-full bg-blue-400 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl text-lg transition-transform hover:scale-105 active:scale-95 shadow-sm"
                >
                  이용상
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-rose-50 flex justify-center text-gray-800 font-sans w-full">
          <div className="w-full max-w-md bg-white shadow-xl flex flex-col relative overflow-hidden h-screen">
            
            {/* 헤더 */}
            <header className="bg-rose-400 text-white p-5 rounded-b-2xl shadow-md z-10 flex justify-between items-center shrink-0">
              <h1 className="text-2xl font-bold tracking-tight">감정 쓰레기통 🗑️</h1>
              <button 
                onClick={() => setIsLoggedIn(false)}
                className="bg-white/20 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 hover:bg-white/30 transition-colors"
                title="로그아웃"
              >
                <Users size={14} /> {currentUser} <LogOut size={12} className="ml-1 opacity-70" />
              </button>
            </header>

            {/* 메인 컨텐츠 영역 */}
            <main className="flex-1 overflow-y-auto p-5 pb-24 h-full">
              
              {/* 1. 예민함 지수 탭 */}
              {activeTab === 'sensitivity' && (
                <div className="animate-fade-in">
                  <h2 className="text-xl font-bold mb-4 flex items-center text-rose-500">
                    <Activity className="mr-2" size={24} /> 오늘의 예민함 지수
                  </h2>
                  
                  <div className="bg-rose-50 rounded-2xl p-6 text-center shadow-sm border border-rose-100 mb-6">
                    <div className="text-5xl font-extrabold text-rose-400 mb-2">{sensitivity}%</div>
                    <p className="text-sm font-bold text-gray-600 mb-6">
                      {sensitivity <= 20 ? '1단계: 평온함 (무념무상) 🧘‍♀️' : 
                       sensitivity <= 40 ? '2단계: 살짝 거슬림 (아직은 참을만함) 😒' : 
                       sensitivity <= 60 ? '3단계: 예민함 (건들지 마라) 뾰족 🦔' : 
                       sensitivity <= 80 ? '4단계: 매우 예민 (건들면 디진다) 🔪' : 
                       '5단계: 폭발 직전 (눈에 뵈는 거 없음) 💣'}
                    </p>
                    
                    <input 
                      type="range" 
                      min="0" max="100" 
                      value={sensitivity}
                      onChange={(e) => setSensitivity(Number(e.target.value))}
                      className="w-full h-2 bg-rose-200 rounded-lg appearance-none cursor-pointer accent-rose-500"
                    />
                    
                    <button 
                      onClick={handleSaveSensitivity}
                      className="mt-6 w-full bg-rose-400 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm"
                    >
                      현재 지수 기록하기
                    </button>
                  </div>

                  <div>
                    <h3 className="font-semibold text-gray-700 mb-3 ml-1">오늘의 변동 기록 ({todayDate})</h3>
                    <div className="space-y-3">
                      {sensitivityLog.filter(log => log.date === todayDate).map(log => (
                        <div key={log.id} className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                          <span className="text-gray-500 text-sm">{log.time}</span>
                          <div className="flex items-center gap-3">
                            <div className="flex items-center gap-2">
                              <div className="w-24 sm:w-32 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div 
                                  className={`h-full ${log.level > 80 ? 'bg-red-500' : log.level > 60 ? 'bg-orange-400' : log.level > 40 ? 'bg-yellow-400' : 'bg-green-400'}`}
                                  style={{ width: `${log.level}%` }}
                                />
                              </div>
                              <span className="font-bold w-8 text-right">{log.level}</span>
                            </div>
                            <button 
                              onClick={() => handleDeleteSensitivity(log.id)}
                              className="text-gray-300 hover:text-red-500 transition-colors p-1 rounded-full hover:bg-red-50"
                            >
                              <X size={16} />
                            </button>
                          </div>
                        </div>
                      ))}
                      {sensitivityLog.filter(log => log.date === todayDate).length === 0 && (
                        <div className="text-center py-4 text-gray-400 text-sm">아직 등록된 기록이 없어요!</div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* 2. 점심 기록 탭 */}
              {activeTab === 'lunch' && (
                <div className="animate-fade-in">
                  <h2 className="text-xl font-bold mb-4 flex items-center text-orange-500">
                    <Camera className="mr-2" size={24} /> 오늘의 식단
                  </h2>

                  <div className="bg-orange-50 rounded-2xl p-5 mb-6 shadow-sm border border-orange-100">
                    <div className="mb-4 relative">
                      {selectedImage ? (
                        <div className="relative rounded-xl overflow-hidden aspect-video bg-gray-100">
                          <img src={selectedImage} alt="Preview" className="w-full h-full object-cover" />
                          <button 
                            onClick={() => setSelectedImage(null)}
                            className="absolute top-2 right-2 bg-black/50 text-white p-1 rounded-full hover:bg-black/70"
                          >
                            <X size={20} />
                          </button>
                        </div>
                      ) : (
                        <label className="flex flex-col items-center justify-center w-full aspect-video border-2 border-dashed border-orange-300 rounded-xl bg-orange-100/50 cursor-pointer hover:bg-orange-100 transition-colors">
                          <ImageIcon className="text-orange-400 mb-2" size={32} />
                          <span className="text-sm text-orange-600 font-medium">사진 등록하기</span>
                          <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                        </label>
                      )}
                    </div>
                    
                    <input 
                      type="text" 
                      placeholder="메뉴 이름이 뭐야?" 
                      value={menuInput}
                      onChange={(e) => setMenuInput(e.target.value)}
                      className="w-full p-3 rounded-xl border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-400 mb-3"
                    />
                    <button 
                      onClick={handleAddMeal}
                      className="w-full bg-orange-400 hover:bg-orange-500 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm"
                    >
                      {currentUser}의 식단 기록 추가하기
                    </button>
                  </div>

                  <div className="flex justify-center gap-2 mb-4">
                    {['ALL', '이서진', '이용상'].map(filter => (
                      <button 
                        key={filter}
                        onClick={() => setMealFilter(filter)}
                        className={`px-4 py-1.5 rounded-full text-sm font-bold transition-colors ${
                          mealFilter === filter ? 'bg-orange-500 text-white shadow-md' : 'bg-orange-100 text-orange-500 hover:bg-orange-200'
                        }`}
                      >
                        {filter === 'ALL' ? '전체 보기' : `${filter} 식단`}
                      </button>
                    ))}
                  </div>

                  <div>
                    <h3 className="font-semibold text-gray-700 mb-3 ml-1">{todayDate} 식단 기록</h3>
                    <div className="grid grid-cols-2 gap-3">
                      {meals.filter(meal => meal.date === todayDate && (mealFilter === 'ALL' || meal.author === mealFilter)).map(meal => (
                        <div key={meal.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative">
                          <span className={`absolute top-2 left-2 text-xs font-bold px-2 py-1 rounded-md z-10 text-white shadow-sm ${meal.author === '이서진' ? 'bg-rose-400' : 'bg-blue-400'}`}>
                            {meal.author}
                          </span>
                          <button 
                            onClick={() => handleDeleteMeal(meal.id)}
                            className="absolute top-2 right-2 z-10 bg-white/80 text-gray-500 hover:text-red-500 hover:bg-white p-1.5 rounded-full shadow-sm backdrop-blur-sm transition-all"
                          >
                            <X size={14} />
                          </button>
                          {meal.image ? (
                            <img src={meal.image} alt={meal.menu} className="w-full h-32 object-cover" />
                          ) : (
                            <div className="w-full h-32 bg-gray-100 flex items-center justify-center text-gray-400">
                              <ImageIcon size={32} />
                            </div>
                          )}
                          <div className="p-3">
                            <p className="font-bold text-gray-800 truncate">{meal.menu}</p>
                            <p className="text-xs text-gray-500 mt-1">{meal.time}</p>
                          </div>
                        </div>
                      ))}
                      {meals.filter(meal => meal.date === todayDate && (mealFilter === 'ALL' || meal.author === mealFilter)).length === 0 && (
                        <div className="col-span-2 text-center py-8 text-gray-400 text-sm">
                          오늘 아직 기록된 식사가 없어! 밥은 꼭 챙겨먹자.
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* 3. 가계부 탭 */}
              {activeTab === 'finance' && (
                <div className="animate-fade-in">
                  <h2 className="text-xl font-bold mb-4 flex items-center text-blue-500">
                    <Receipt className="mr-2" size={24} /> 텅장 방지 가계부
                  </h2>

                  <div className="flex justify-center gap-2 mb-4">
                    {['ALL', '이서진', '이용상'].map(filter => (
                      <button 
                        key={filter}
                        onClick={() => setExpenseFilter(filter)}
                        className={`px-4 py-1.5 rounded-full text-sm font-bold transition-colors ${
                          expenseFilter === filter ? 'bg-blue-500 text-white shadow-md' : 'bg-blue-100 text-blue-500 hover:bg-blue-200'
                        }`}
                      >
                        {filter === 'ALL' ? '전체 보기' : `${filter} 지출`}
                      </button>
                    ))}
                  </div>

                  <div className="bg-blue-500 text-white rounded-2xl p-6 mb-6 shadow-md">
                    <p className="text-blue-100 text-sm mb-1">{todayDate} {expenseFilter === 'ALL' ? '총' : expenseFilter} 지출액</p>
                    <div className="text-4xl font-extrabold tracking-tight mb-4">
                      {totalExpense.toLocaleString()} <span className="text-xl font-medium">원</span>
                    </div>
                    
                    {Object.keys(expensesByCategory).length > 0 && (
                      <div className="bg-blue-600/50 rounded-xl p-3 text-sm grid grid-cols-2 gap-2">
                        {Object.entries(expensesByCategory).map(([cat, amount]) => (
                          <div key={cat} className="flex justify-between">
                            <span className="text-blue-200">{cat}</span>
                            <span className="font-semibold">{amount.toLocaleString()}원</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="bg-blue-50 rounded-2xl p-5 mb-6 shadow-sm border border-blue-100 flex flex-col gap-2">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-sm font-bold text-blue-800">지출 등록 ({currentUser})</span>
                      <span className="text-xs text-blue-500">* 키워드 자동 분류</span>
                    </div>
                    <div className="flex gap-2">
                      <div className="flex-1 space-y-2">
                        <input 
                          type="text" 
                          placeholder="어디에 썼어? (예: 술값, 스벅)" 
                          value={expenseItem}
                          onChange={(e) => setExpenseItem(e.target.value)}
                          className="w-full p-3 rounded-xl border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm"
                        />
                        <input 
                          type="number" 
                          placeholder="얼마나 썼어? (숫자만)" 
                          value={expenseAmount}
                          onChange={(e) => setExpenseAmount(e.target.value)}
                          className="w-full p-3 rounded-xl border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm"
                        />
                      </div>
                      <button 
                        onClick={handleAddExpense}
                        className="bg-blue-500 hover:bg-blue-600 text-white rounded-xl w-16 flex items-center justify-center transition-colors"
                      >
                        <Plus size={24} />
                      </button>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {filteredExpenses.map(expense => (
                      <div key={expense.id} className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <div className="flex items-center gap-3">
                          <span className={`text-xs font-bold px-2 py-1 rounded-md text-white ${expense.author === '이서진' ? 'bg-rose-400' : 'bg-blue-400'}`}>
                            {expense.author}
                          </span>
                          <div>
                            <p className="font-bold text-gray-800 flex items-center gap-2">
                              {expense.item}
                              <span className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">
                                {expense.category}
                              </span>
                            </p>
                            <p className="text-xs text-gray-400">{expense.time}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-bold text-blue-500">
                            -{expense.amount.toLocaleString()}원
                          </span>
                          <button 
                            onClick={() => handleDeleteExpense(expense.id)}
                            className="text-gray-300 hover:text-red-500 transition-colors p-1 rounded-full hover:bg-red-50"
                          >
                            <X size={16} />
                          </button>
                        </div>
                      </div>
                    ))}
                    {filteredExpenses.length === 0 && (
                      <div className="text-center py-8 text-gray-400 text-sm">
                        오늘 아직 돈을 안 썼네! 칭찬해 👏
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* 3-5. 달력 탭 */}
              {activeTab === 'calendar' && (
                <div className="animate-fade-in">
                  <h2 className="text-xl font-bold mb-4 flex items-center text-indigo-500">
                    <CalendarIcon className="mr-2" size={24} /> 월별 지출 달력
                  </h2>

                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
                    <div className="flex justify-between items-center mb-4">
                      <button onClick={prevMonth} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                        <ChevronLeft size={20} className="text-gray-600" />
                      </button>
                      <h3 className="font-extrabold text-lg text-gray-800">
                        {calYear}년 {calMonth + 1}월
                      </h3>
                      <button onClick={nextMonth} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                        <ChevronRight size={20} className="text-gray-600" />
                      </button>
                    </div>

                    <div className="grid grid-cols-7 gap-1 mb-2">
                      {['일', '월', '화', '수', '목', '금', '토'].map((day, idx) => (
                        <div key={day} className={`text-center text-xs font-bold py-1 ${idx === 0 ? 'text-red-400' : idx === 6 ? 'text-blue-400' : 'text-gray-400'}`}>
                          {day}
                        </div>
                      ))}
                    </div>

                    <div className="grid grid-cols-7 gap-1">
                      {Array.from({ length: firstDayOfMonth }).map((_, i) => (
                        <div key={`empty-${i}`} className="aspect-[4/5] p-1"></div>
                      ))}
                      
                      {Array.from({ length: daysInMonth }).map((_, i) => {
                        const day = i + 1;
                        const dateString = new Date(calYear, calMonth, day).toLocaleDateString('ko-KR');
                        const isToday = dateString === todayDate;
                        const dayExpense = expensesByDate[dateString] || 0;
                        const dayOfWeek = new Date(calYear, calMonth, day).getDay();

                        return (
                          <div 
                            key={day} 
                            className={`aspect-[4/5] rounded-xl p-1 flex flex-col border ${
                              isToday ? 'bg-indigo-50 border-indigo-200' : 'bg-gray-50 border-transparent hover:border-gray-200'
                            }`}
                          >
                            <span className={`text-[10px] font-bold ${
                              dayOfWeek === 0 ? 'text-red-400' : dayOfWeek === 6 ? 'text-blue-400' : 'text-gray-600'
                            } ${isToday ? 'text-indigo-600' : ''}`}>
                              {day}
                            </span>
                            {dayExpense > 0 && (
                              <div className="mt-auto pb-1 w-full text-center">
                                <span className="text-[9px] sm:text-[10px] font-extrabold text-blue-500 tracking-tighter truncate block w-full">
                                  -{dayExpense.toLocaleString()}
                                </span>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* 4. 감정 쓰레기통 탭 */}
              {activeTab === 'trash' && (
                <div className="animate-fade-in">
                  <h2 className="text-xl font-bold mb-4 flex items-center text-purple-500">
                    <Trash2 className="mr-2" size={24} /> 진짜 감정 쓰레기통
                  </h2>
                  
                  <p className="text-sm text-gray-500 mb-4 ml-1">
                    짜증나고 화나는 일, 남몰래 하고 싶은 욕, 여기에 다 쏟아내고 버려버려! 
                  </p>

                  <div className={`transition-all duration-500 ${isThrowing ? 'scale-90 opacity-0 blur-sm' : 'scale-100 opacity-100'}`}>
                    <div className="bg-purple-50 p-1 rounded-2xl shadow-sm border border-purple-100 mb-4">
                      <textarea 
                        rows="5"
                        placeholder="여기다 다 적어버려!!!" 
                        value={trashText}
                        onChange={(e) => setTrashText(e.target.value)}
                        className="w-full p-4 bg-transparent resize-none focus:outline-none text-gray-700"
                      />
                      <div className="flex justify-end p-2">
                        <button 
                          onClick={handleThrowAway}
                          disabled={isThrowing}
                          className="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2 rounded-xl font-semibold flex items-center transition-colors"
                        >
                          <Send size={16} className="mr-2" /> 버려버리기
                        </button>
                      </div>
                    </div>
                  </div>

                  {trashedItems.length > 0 && (
                    <div className="mt-8">
                      <h3 className="font-semibold text-gray-400 mb-3 text-sm text-center">비워낸 감정들</h3>
                      <div className="flex flex-wrap gap-2 justify-center opacity-50">
                        {trashedItems.map((item, i) => (
                          <div key={item.id} className="bg-gray-200 text-gray-500 px-3 py-1 rounded-full text-xs line-through italic">
                            {item.text.length > 10 ? item.text.substring(0, 10) + '...' : item.text}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

            </main>

            {/* 하단 네비게이션 */}
            <nav className="bg-white border-t border-gray-100 flex justify-around p-3 pb-safe absolute bottom-0 w-full shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-20 shrink-0">
              <button 
                onClick={() => setActiveTab('sensitivity')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'sensitivity' ? 'text-rose-500' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <Activity size={24} className={activeTab === 'sensitivity' ? 'animate-bounce' : ''} />
                <span className="text-[10px] mt-1 font-medium">예민함</span>
              </button>
              
              <button 
                onClick={() => setActiveTab('lunch')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'lunch' ? 'text-orange-500' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <Camera size={24} className={activeTab === 'lunch' ? 'animate-bounce' : ''} />
                <span className="text-[10px] mt-1 font-medium">식단</span>
              </button>

              <button 
                onClick={() => setActiveTab('finance')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'finance' ? 'text-blue-500' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <Receipt size={24} className={activeTab === 'finance' ? 'animate-bounce' : ''} />
                <span className="text-[10px] mt-1 font-medium">가계부</span>
              </button>

              <button 
                onClick={() => setActiveTab('calendar')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'calendar' ? 'text-indigo-500' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <CalendarIcon size={24} className={activeTab === 'calendar' ? 'animate-bounce' : ''} />
                <span className="text-[10px] mt-1 font-medium">달력</span>
              </button>

              <button 
                onClick={() => setActiveTab('trash')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'trash' ? 'text-purple-500' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <Trash2 size={24} className={activeTab === 'trash' ? 'animate-bounce' : ''} />
                <span className="text-[10px] mt-1 font-medium">버리기</span>
              </button>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
